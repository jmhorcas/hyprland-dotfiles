################################################################################
# HYPRIDLE CONFIGURATION FILE
# Optimized for CachyOS + Hyprland
################################################################################

general {
    # Avoid starting multiple hyprlock instances
    lock_cmd = pidof hyprlock || hyprlock       
    
    # Lock the session before the system goes to sleep
    before_sleep_cmd = loginctl lock-session    
    
    # Wake up monitors when the system resumes from sleep
    after_sleep_cmd = hyprctl dispatch dpms on  
}

# STEP 1: Dim the screen brightness (2.5 minutes)
# Helps save energy and warns you that the screen will lock soon
# Only for laptops!
listener {
    timeout = 150                                
    on-timeout = brightnessctl set 10% -q        # Set brightness to 10%
    on-resume = brightnessctl set 100% -q        # Restore brightness on activity
}

# STEP 2: Lock the screen (5 minutes)
# Triggers the lock_cmd defined in the general section
listener {
    timeout = 300                                
    on-timeout = loginctl lock-session           
}

# STEP 3: Turn off the monitor (6 minutes)
# Saves power by putting monitors into DPMS standby mode
listener {
    timeout = 360                                
    on-timeout = hyprctl dispatch dpms off       
    on-resume = hyprctl dispatch dpms on         # Re-enable monitors on activity
}

# STEP 4: Suspend the system (10 minutes)
# Fully puts the PC into sleep mode (Optional - Uncomment to enable)
# listener {
#     timeout = 600                                
#     on-timeout = systemctl suspend               
# }
