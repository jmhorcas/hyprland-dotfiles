[[mgr.prepend_keymap]]
on   = [ "<C-n>" ]
run  = 'shell -- dragon-drop -x -i -T "$@"'
desc = "Dragon-drop"

[[mgr.prepend_keymap]]
on   = [ "y" ]
run  = [ "yank", "plugin clipboard -- --action=copy" ]
desc = "Copiar al portapapeles externo"

[[mgr.prepend_keymap]]
on   = [ "<C-p>" ]
run  = [ "plugin clipboard -- --action=paste" ]
desc = "Pegar desde el portapapeles externo"

[[mgr.prepend_keymap]]
on   = [ "R", "b" ] 
run  = "plugin recycle-bin"
desc = "Papelera de reciclaje"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "p" ]
run  = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "h" ]
run  = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "l" ]
run  = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "u" ]
run  = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"

[[picker.prepend_keymap]]
on   = [ "enter" ]
run  = "close --submit"
desc = "Confirm and send file"
