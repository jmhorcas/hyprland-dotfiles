[opener]
edit = [
    { run = 'micro "$@"', block = true, desc = "Edit with Micro" }
]

image = [
	{ run = 'imv "$@"', desc = "Imv (Image viewer)" },
	{ run = 'xdg-open "$@"', desc = "Default" }
]

[open]
rules = [
	{ mime = "image/*", use = ["image"] },

	{ mime = "text/*", use = ["edit"] },

	{ mime = "*", use = ["open"] },
]
